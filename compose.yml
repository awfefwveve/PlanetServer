services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: planet
      POSTGRES_PASSWORD: planet-local-dev-only
      POSTGRES_DB: planet
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - planet_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planet -d planet"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  planet_data:
