syntax = "proto3";
option csharp_namespace = "Planet.Protocol";
package planet;

// Client sends intentions; only the server changes game state.
message Command {
  uint64 sequence = 1;
  string kind = 2; // login, move, attack, claim, snapshot
  string name = 3;
  string password = 4;
  float dx = 5;
  float dz = 6;
  bool lobby_login = 7;
  string character_id = 8;
  string display_name = 9;
  Appearance appearance = 10;
  string realm_id = 11;
  string portal_id = 12;
  int32 channel_id = 13;
  string chat_text = 14; // kinds also include: chat, portal, switch_channel, revive
  int64 chat_after = 15;
  string target_id = 16;
  // Login only. true = this client also accepts server-initiated Update frames
  // (push=true, sequence=0) between replies. Old clients omit it and keep
  // strict request/response framing.
  bool subscribe_updates = 17;
  // Inventory and skills: use_item, equip, unequip, move_item, discard_item, skill, learn_skill.
  int32 slot = 18;         // bag slot (use_item, equip, move_item from, discard_item)
  int32 target_slot = 19;  // move_item destination
  string skill_id = 20;    // skill, learn_skill (target_id carries the monster for single-target skills)
  string equip_slot = 21;  // unequip: weapon, hat, body, shoes
  // Shop and trade: shop_buy (target_id=item, count), shop_sell (slot, count),
  // trade_request / trade_accept (target_id=player), trade_offer (slot, count, gold), trade_confirm, trade_cancel.
  int32 count = 22;
  int64 gold = 23;
  // chat: "" (room), "party", "whisper" (target_id = character name).
  // party_invite (target_id = account or character name), party_accept (target_id = inviter account),
  // party_decline, party_leave, party_kick (target_id = member account).
  string chat_scope = 24;
}
message TradeItemView {
  int32 slot = 1;        // slot in the owner's bag
  string item_id = 2;
  int32 count = 3;
}
message TradeView {
  string partner = 1;       // account name
  string partner_name = 2;  // character display name
  string state = 3;         // invited (I asked), incoming (they asked), open
  repeated TradeItemView mine = 4;
  repeated TradeItemView theirs = 5;
  int64 my_gold = 6;
  int64 their_gold = 7;
  bool my_confirmed = 8;
  bool their_confirmed = 9;
}
message ItemStackView {
  int32 slot = 1;
  string item_id = 2;
  int32 count = 3;
}
message EquipView {
  string slot = 1;
  string item_id = 2;
}
message Inventory {
  int32 capacity = 1;
  repeated ItemStackView items = 2;
  repeated EquipView equipped = 3;
}
message SkillView {
  string id = 1;
  int32 level = 2;
  float cooldown_remaining = 3;
}
message ChatMessage {
  int64 id = 1;
  string sender = 2;
  string text = 3;
  int32 channel_id = 4;
  string region_id = 5;
  string scope = 6;   // room, party, whisper, system
  string to = 7;      // whisper recipient (character name)
}
message PartyMemberView {
  string name = 1;          // account name
  string display_name = 2;
  int32 level = 3;
  int32 hp = 4;
  int32 max_hp = 5;
  int32 channel_id = 6;
  string region_id = 7;
  bool leader = 8;
}
message PartyView {
  repeated PartyMemberView members = 1;
  string invited_by = 2;        // account name of a pending invitation to me
  string invited_by_name = 3;
}
message Appearance {
  string archetype = 1;
  int32 gender = 2;
  int32 skin = 3;
  int32 face = 4;
  int32 hair = 5;
  int32 hair_color = 6;
}
message CharacterInfo {
  string id = 1;
  string name = 2;
  Appearance appearance = 3;
}
message PlayerView {
  string name = 1;
  float x = 2;
  float z = 3;
  int32 kills = 4;
  int32 shards = 5;
  int32 gold = 6;
  bool quest_claimed = 7;
  string character_id = 8;
  string display_name = 9;
  Appearance appearance = 10;
  int32 hp = 11;
  int32 max_hp = 12;
  int32 level = 13;
  bool dead = 14;
}
message MonsterView {
  float x = 1;
  float z = 2;
  int32 hp = 3;
  int32 max_hp = 4;
  string id = 5;
  string spawn_zone = 6;
  string state = 7;   // idle, chase, return, dead
  string target = 8;  // account name being chased, empty otherwise
}
// Something that happened in a room since the previous tick. Presentation only:
// authoritative values are always in players/monsters/self_stats.
message CombatEvent {
  string kind = 1;    // monster_hit, player_hit, player_died, level_up, revived, item_gained, skill_used, healed
  string source = 2;  // account name or monster id
  string target = 3;
  int32 amount = 4;
  float x = 5;
  float z = 6;
}
message ChannelView {
  int32 id = 1;
  int32 online = 2;
  int32 reserved = 3;
  int32 capacity = 4;
}
message CharacterStats {
  int32 level = 1;
  int64 experience = 2;
  int64 next_level_experience = 3;
  int32 hp = 4;
  int32 max_hp = 5;
  int32 mp = 6;
  int32 max_mp = 7;
  int32 attack = 8;
  int32 defense = 9;
}
message Update {
  uint64 sequence = 1;
  string code = 2;
  string message = 3;
  repeated PlayerView players = 4;
  MonsterView monster = 5;
  int64 tick = 6;
  repeated CharacterInfo characters = 7;
  bool in_world = 8;
  string selected_character_id = 9;
  string region_id = 10;
  int32 channel_id = 11;
  repeated ChannelView channels = 12;
  repeated ChatMessage chat = 13;
  repeated MonsterView monsters = 14;
  CharacterStats self_stats = 15;
  // true = produced by the server tick, not a reply. sequence is 0 and code is "tick".
  // Replies and pushes may arrive out of tick order; clients keep the highest tick.
  bool push = 16;
  repeated CombatEvent events = 17;
  Inventory inventory = 18;       // own character only
  repeated SkillView skills = 19; // learned skills, own character only
  int32 skill_points = 20;
  TradeView trade = 21;           // present while a trade invitation or window exists
  PartyView party = 22;           // own party and pending invitation
}
