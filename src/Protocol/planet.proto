syntax = "proto3";
option csharp_namespace = "Planet.Protocol";
package planet;

// Client sends intentions; only the server changes game state.
message Command {
  uint64 sequence = 1;
  string kind = 2; // login, move, attack, claim, snapshot
  string name = 3;
  string password = 4;
  float dx = 5;
  float dz = 6;
  bool lobby_login = 7;
  string character_id = 8;
  string display_name = 9;
  Appearance appearance = 10;
  string realm_id = 11;
  string portal_id = 12;
  int32 channel_id = 13;
}
message Appearance {
  string archetype = 1;
  int32 gender = 2;
  int32 skin = 3;
  int32 face = 4;
  int32 hair = 5;
  int32 hair_color = 6;
}
message CharacterInfo {
  string id = 1;
  string name = 2;
  Appearance appearance = 3;
}
message PlayerView {
  string name = 1;
  float x = 2;
  float z = 3;
  int32 kills = 4;
  int32 shards = 5;
  int32 gold = 6;
  bool quest_claimed = 7;
  string character_id = 8;
  string display_name = 9;
  Appearance appearance = 10;
}
message MonsterView {
  float x = 1;
  float z = 2;
  int32 hp = 3;
  int32 max_hp = 4;
}
message ChannelView {
  int32 id = 1;
  int32 online = 2;
  int32 reserved = 3;
  int32 capacity = 4;
}
message Update {
  uint64 sequence = 1;
  string code = 2;
  string message = 3;
  repeated PlayerView players = 4;
  MonsterView monster = 5;
  int64 tick = 6;
  repeated CharacterInfo characters = 7;
  bool in_world = 8;
  string selected_character_id = 9;
  string region_id = 10;
  int32 channel_id = 11;
  repeated ChannelView channels = 12;
}
